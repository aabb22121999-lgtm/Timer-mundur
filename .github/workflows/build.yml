name: Build Timer

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --onefile --noconsole --name TimerOverlay timer.py
      - uses: actions/upload-artifact@v4
        with:
          name: TimerOverlay-Windows
          path: dist/TimerOverlay.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --windowed --name TimerOverlay timer.py
      - run: ditto -c -k --sequesterRsrc --keepParent dist/TimerOverlay.app dist/TimerOverlay-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TimerOverlay-Mac
          path: dist/TimerOverlay-Mac.zip
